<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>BTC15 Paper Terminal</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;background:#0b0f14;color:#dde;margin:0;padding:10px;font-size:14px}
.b{background:#b00;color:#fff;text-align:center;font-weight:700;padding:8px;border-radius:6px}.c{background:#151b23;border-radius:8px;padding:10px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:4px;border-bottom:1px solid #223;text-align:left}.g{color:#4c8}.r{color:#e55}h3{margin:4px 0}</style></head><body>
<div class=b>PAPER TRADING — NOT REAL MONEY</div><div class=c id=m></div><div class=c><h3>Agents</h3><table id=a></table></div><div class=c><h3>Trade log</h3><table id=t></table></div>
<script>let S;const $=i=>document.getElementById(i),cl=v=>v>=0?'g':'r';
function draw(){if(!S)return;const m=S.market||{},left=Math.max(0,(Date.parse(m.close)-Date.now())/1e3|0);
$('m').innerHTML=`<h3>${m.ticker||'-'}</h3>BTC spot <b>$${(+S.spot).toFixed(2)}</b> · price to beat <b>$${m.strike}</b><br>YES ${Math.round(m.yes_bid*100)}/${Math.round(m.yes_ask*100)}c · NO ${Math.round(m.no_bid*100)}/${Math.round(m.no_ask*100)}c<br>Closes in <b>${left/60|0}m ${left%60}s</b><br>Portfolio $${S.portfolio.bankroll} (start $${S.portfolio.start.toFixed(2)}) · P&L <span class=${cl(S.portfolio.pnl)}>${S.portfolio.pnl}</span> · open ${S.portfolio.open}<br><small>updated ${S.updated}</small>`;
$('a').innerHTML='<tr><th>Agent</th><th>Bank</th><th>W/L</th><th>P&L</th><th>Last call</th></tr>'+Object.entries(S.agents).map(([n,a])=>`<tr><td>${n}${n=='Lock'?'<br><small>calls in last 3-5 min</small>':''}</td><td>$${a.bankroll}</td><td>${a.wins}/${a.losses} ${a.wins+a.losses?Math.round(100*a.wins/(a.wins+a.losses))+'%':''}</td><td class=${cl(a.pnl)}>${a.pnl}</td><td><b>${a.last?.call||'-'}</b> ${a.last?.reason||''}</td></tr>`).join('');
$('t').innerHTML='<tr><th>Time</th><th>Type</th><th>Agent</th><th>Side@c</th><th>Qty</th><th>P&L/Reason</th></tr>'+S.trades.slice(0,60).map(t=>`<tr><td>${new Date(t.time).toLocaleTimeString()}</td><td>${t.type}</td><td>${t.agent}</td><td>${t.side?t.side.toUpperCase()+'@'+t.price:''}</td><td>${t.contracts||''}</td><td>${t.type=='SETTLE'?`<span class=${cl(t.pnl)}>${t.pnl}</span> ${t.result}`:t.reason||''}</td></tr>`).join('')}
async function f(){try{S=await (await fetch('state.json?'+Date.now())).json()}catch(e){}draw()}f();setInterval(f,15e3);setInterval(draw,1e3)</script></body></html>
